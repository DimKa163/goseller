name: Go-seller CI
run-name: testing Go-Seller
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-go.yml
        id: go-setup
      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-go.yml

      - name: Run tests
        run: go test -race -cover ./...

  build:
    runs-on: ubuntu-latest
    needs: [ lint, test ]
    steps:
      - uses: ./.github/actions/setup-go.yml

      - name: Build user-app
        run: |
          mkdir -p build
          go build -o build/user-app ./cmd/user

      - name: Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: user-app
          path: build/user-app
          if-no-files-found: error
          retention-days: 3
